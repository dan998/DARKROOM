<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>HUNTED – Level Two</title>
  <link rel="stylesheet" href="level2.css">
</head>
<body>

<div class="overlay"></div>

<div class="level">
  <h1>LEVEL TWO</h1>

  <p id="story">
    The corridor judges memory.<br>
    What you touch cannot be touched again.
  </p>

  <!-- Vision -->
  <div id="vision" class="vision"></div>

  <!-- Symbol Hall -->
  <div class="hall">
    <button class="symbol" onclick="choose('☪️')">☪️</button>
    <button class="symbol" onclick="choose('✡️')">✡️</button>
    <button class="symbol" onclick="choose('☯️')">☯️</button>
    <button class="symbol" onclick="choose('🕎')">🕎</button>
  </div>

  <p id="result" class="result"></p>
</div>

<script src="level2.js"></script>
</body>
</html>
